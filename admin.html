<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Brote - Panel de Control</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #121413; min-height: 100vh; color: #f0f0f0; padding: 25px 15px; }

        /* PANTALLA DE LOGIN */
        .login-card {
            max-width: 400px;
            margin: 100px auto;
            background: rgba(26, 31, 28, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .login-card h2 { font-size: 1.6rem; color: #4ade80; margin-bottom: 8px; }
        .login-card p { color: #90a4ae; font-size: 0.9rem; margin-bottom: 20px; }
        .login-input {
            width: 100%;
            padding: 12px 16px;
            background: #171c19;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            margin-bottom: 16px;
            outline: none;
        }
        .login-input:focus { border-color: #4ade80; }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-login:hover { background: #388e3c; }

        /* DASHBOARD PRINCIPAL */
        .dashboard-container {
            display: none;
            max-width: 1200px;
            margin: 0 auto;
        }
        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.12);
        }
        .dash-header h1 { font-size: 1.8rem; color: #4ade80; display: flex; align-items: center; gap: 8px; }
        .btn-logout {
            background: rgba(220, 38, 38, 0.2);
            color: #ef5350;
            border: 1px solid rgba(220, 38, 38, 0.4);
            padding: 8px 16px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
        }

        /* FORMULARIO DE PRODUCTO */
        .form-card {
            background: #171c19;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .form-card h3 { font-size: 1.2rem; color: #81c784; margin-bottom: 20px; }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 0.85rem; color: #b0bec5; font-weight: 600; }
        .form-control {
            padding: 10px 14px;
            background: #232a26;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }
        .form-control:focus { border-color: #4ade80; }
        textarea.form-control { resize: vertical; min-height: 80px; }

        .btn-submit {
            background: #2e7d32;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background 0.2s;
        }
        .btn-submit:hover { background: #388e3c; }

        /* TABLA DE INVENTARIO */
        .table-responsive {
            background: #171c19;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            overflow-x: auto;
            padding: 20px;
        }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 0.9rem; }
        th { color: #81c784; font-weight: 700; }
        .table-img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; }
        
        .badge-status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
        }
        .badge-disponible { background: rgba(74, 222, 128, 0.2); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.4); }
        .badge-agotado { background: rgba(239, 83, 80, 0.2); color: #ef5350; border: 1px solid rgba(239, 83, 80, 0.4); }

        .btn-delete {
            background: transparent;
            border: 1px solid #ef5350;
            color: #ef5350;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .btn-delete:hover { background: #ef5350; color: #fff; }
    </style>
</head>
<body>

    <!-- VISTA DE LOGIN -->
    <div id="loginSection" class="login-card">
        <h2>🌿 Mundo Brote</h2>
        <p>Panel de Administración de Inventario</p>
        <input type="password" id="adminPassInput" class="login-input" placeholder="Ingresa la contraseña maestra..." onkeydown="if(event.key==='Enter') verifyLogin()">
        <button type="button" class="btn-login" onclick="verifyLogin()">Iniciar Sesión</button>
    </div>

    <!-- VISTA DEL DASHBOARD -->
    <div id="dashboardSection" class="dashboard-container">
        <div class="dash-header">
            <h1>🌿 Gestión de Productos</h1>
            <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
        </div>

        <!-- FORMULARIO AGREGAR PRODUCTO -->
        <div class="form-card">
            <h3>✨ Agregar Nuevo Producto</h3>
            <form id="productForm" onsubmit="saveProduct(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nombre de la Planta *</label>
                        <input type="text" id="pNombre" class="form-control" placeholder="Ej: Ficus Danielle" required>
                    </div>

                    <div class="form-group">
                        <label>Categoría *</label>
                        <select id="pCategoria" class="form-control" required>
                            <option value="suculentas">🌵 Suculentas y Colgantes</option>
                            <option value="flor">🌸 Plantas con Flor</option>
                            <option value="interior">🌿 Interior</option>
                            <option value="exterior">🌳 Exterior y Jardín</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Precio Numérico * (Ej: 4000)</label>
                        <input type="number" id="pPrecioNum" class="form-control" placeholder="4000" required>
                    </div>

                    <div class="form-group">
                        <label>Ruta Foto Principal * (Ej: interior/ficus.jpg)</label>
                        <input type="text" id="pFoto" class="form-control" placeholder="interior/ficus.jpg" required>
                    </div>

                    <div class="form-group">
                        <label>Ruta Foto Adulta/Referencia (Opcional)</label>
                        <input type="text" id="pFotoGrande" class="form-control" placeholder="interior/ficusgrande.jpg">
                    </div>

                    <div class="form-group">
                        <label>¿Es Novedad? (Aparece en inicio)</label>
                        <select id="pEsNovedad" class="form-control">
                            <option value="false">No</option>
                            <option value="true">Sí</option>
                        </select>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 15px;">
                    <label>Guía de Cuidados (Luz, Riego, Precauciones)</label>
                    <textarea id="pCuidados" class="form-control" placeholder="☀️ Luz: ...&#10;💧 Agua: ...&#10;⚠️ Precaución: ..."></textarea>
                </div>

                <button type="submit" class="btn-submit">💾 Guardar Producto en Catálogo</button>
            </form>
        </div>

        <!-- LISTADO Y CONTROL DE STOCK -->
        <div class="table-responsive">
            <h3 style="color:#81c784; margin-bottom:15px;">📋 Inventario Actual (<span id="totalCount">0</span>)</h3>
            <table>
                <thead>
                    <tr>
                        <th>Foto</th>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Precio</th>
                        <th>Estado (Clic p/ cambiar)</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="inventoryTableBody">
                    <tr><td colspan="6" style="text-align:center;">Cargando inventario...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://ezyogvjosmrxyytzszx.supabase.co";
        const SUPABASE_KEY = "sb_publishable_QB6TAndK9BizyHSec-xTvg_6VHLUGXX";
        let supabaseClient = null;

        function getSupabase() {
            if (!supabaseClient && window.supabase) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }
            return supabaseClient;
        }

        const ADMIN_SECRET = "16De@ctubre";

        function verifyLogin() {
            const inputVal = document.getElementById('adminPassInput').value.trim();
            if (inputVal === ADMIN_SECRET) {
                sessionStorage.setItem('mb_admin_auth', 'true');
                showDashboard();
            } else {
                alert("Contraseña incorrecta 🔒");
            }
        }

        function showDashboard() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('dashboardSection').style.display = 'block';
            loadInventory();
        }

        function logout() {
            sessionStorage.removeItem('mb_admin_auth');
            location.reload();
        }

        async function loadInventory() {
            const client = getSupabase();
            const tbody = document.getElementById('inventoryTableBody');
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Cargando inventario...</td></tr>';

            if (!client) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#ef5350;">Conectando con Supabase...</td></tr>';
                setTimeout(loadInventory, 1000);
                return;
            }

            const { data: productos, error } = await client
                .from('productos')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                console.error("Error al cargar inventario:", error);
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#ef5350;">Error al cargar datos.</td></tr>';
                return;
            }

            document.getElementById('totalCount').innerText = productos.length;

            if (productos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No hay productos registrados en Supabase. Agrega el primero arriba. 🌿</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            productos.forEach(p => {
                const tr = document.createElement('tr');
                const isAgotado = (p.estado === 'agotado');

                tr.innerHTML = `
                    <td><img src="${p.foto || 'fondo.jpg'}" class="table-img" onerror="this.src='fondo.jpg'"></td>
                    <td><strong>${p.nombre}</strong></td>
                    <td>${p.categoria}</td>
                    <td>${p.precio}</td>
                    <td>
                        <span class="badge-status ${isAgotado ? 'badge-agotado' : 'badge-disponible'}" onclick="toggleStock(${p.id}, '${p.estado}')">
                            ${isAgotado ? '⚠️ Agotado' : '✅ Disponible'}
                        </span>
                    </td>
                    <td>
                        <button class="btn-delete" onclick="deleteProduct(${p.id}, '${p.nombre}')">🗑️ Eliminar</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function saveProduct(e) {
            e.preventDefault();
            const client = getSupabase();
            const precioNum = parseInt(document.getElementById('pPrecioNum').value);
            const formattedPrice = '$' + precioNum.toLocaleString('es-CL');

            const newProduct = {
                nombre: document.getElementById('pNombre').value.trim(),
                categoria: document.getElementById('pCategoria').value,
                precio: formattedPrice,
                precio_num: precioNum,
                foto: document.getElementById('pFoto').value.trim(),
                foto_grande: document.getElementById('pFotoGrande').value.trim() || null,
                cuidados: document.getElementById('pCuidados').value.trim(),
                es_novedad: document.getElementById('pEsNovedad').value === 'true',
                estado: 'disponible'
            };

            const { error } = await client.from('productos').insert([newProduct]);

            if (error) {
                alert("Error al guardar: " + error.message);
            } else {
                alert("¡Planta agregada exitosamente! 🌿");
                document.getElementById('productForm').reset();
                loadInventory();
            }
        }

        async function toggleStock(id, currentStatus) {
            const client = getSupabase();
            const nextStatus = (currentStatus === 'disponible') ? 'agotado' : 'disponible';
            const { error } = await client.from('productos').update({ estado: nextStatus }).eq('id', id);
            if (!error) loadInventory();
        }

        async function deleteProduct(id, name) {
            const client = getSupabase();
            if (confirm(`¿Estás seguro de eliminar "${name}" del catálogo?`)) {
                const { error } = await client.from('productos').delete().eq('id', id);
                if (!error) loadInventory();
            }
        }

        if (sessionStorage.getItem('mb_admin_auth') === 'true') {
            showDashboard();
        }
    </script>
</body>
</html>
